<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ddocker hub</title>
<link rel="preload" href="/hub/mono.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "JetBrains Mono";
  src: url("/hub/mono.woff2") format("woff2");
  font-weight: 100 800;
  font-display: swap;
}

/* Light: paper white + ink + electric blue */
:root {
  --bg: #fafafa; --bg-deep: #f0f0f0; --surface: #ffffff; --surface-2: #f4f4f4;
  --text: #111111; --muted: #6a6a6a; --line: #d6d6d6; --line-strong: #111111;
  --brand: #2f64eb; --brand-ink: #ffffff; --brand-soft: #2f64eb1a; --ok: #1f9d55; --warn: #d4502b;
  --band-1: #a4b6ee; --band-2: #7f9cf2; --band-3: #4a78ef; --band-4: #1f47b8;
  --dust-1: #c4cff3; --dust-2: #93a9f0;
  --code: #efefef; --select: #2f64eb24;
  color-scheme: light;
}
/* Dark: Tokyo Night */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1b26; --bg-deep: #13141c; --surface: #1f2230; --surface-2: #24283b;
    --text: #c0caf5; --muted: #8b93b8; --line: #2f3449; --line-strong: #414868;
    --brand: #7aa2f7; --brand-ink: #0c0e10; --brand-soft: #7aa2f71f; --ok: #9ece6a; --warn: #f7768e;
    --band-1: #28345e; --band-2: #3d59a1; --band-3: #5f86e0; --band-4: #7aa2f7;
    --dust-1: #232a45; --dust-2: #2f3d6e;
    --code: #16161e; --select: #7aa2f71f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1b26; --bg-deep: #13141c; --surface: #1f2230; --surface-2: #24283b;
  --text: #c0caf5; --muted: #8b93b8; --line: #2f3449; --line-strong: #414868;
  --brand: #7aa2f7; --brand-ink: #0c0e10; --brand-soft: #7aa2f71f; --ok: #9ece6a; --warn: #f7768e;
  --band-1: #28345e; --band-2: #3d59a1; --band-3: #5f86e0; --band-4: #7aa2f7;
  --dust-1: #232a45; --dust-2: #2f3d6e;
  --code: #16161e; --select: #7aa2f71f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-feature-settings: "calt" 0;
}
::selection { background: var(--select); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.b1 { fill: var(--band-1); } .b2 { fill: var(--band-2); } .b3 { fill: var(--band-3); } .b4 { fill: var(--band-4); }
.d1 { fill: var(--dust-1); } .d2 { fill: var(--dust-2); }

/* ── top bar ─────────────────────────────────────────── */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 18px; height: 56px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.logo .wordmark { display: block; width: auto; height: 21px; margin: 0; }
.bar-search { flex: 1; min-width: 0; }
body.home .bar-search { visibility: hidden; }
/* Front page: no bar. The buttons float over the hero's top-right corner. */
body.home .bar { position: absolute; top: 0; left: 0; right: 0; background: transparent; border-bottom: 0; }
body.home .bar .wrap { max-width: none; justify-content: flex-end; }
body.home .bar .logo, body.home .bar-search { display: none; }
body.home .theme-btn { background: var(--bg); }
.bar-right { display: flex; align-items: center; gap: 14px; font-size: 13px; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.status i { width: 8px; height: 8px; background: var(--muted); display: inline-block; }
.status.online i { background: var(--ok); }
.status.offline i { background: var(--warn); }
a.status { text-decoration: none; }
a.status:hover { color: var(--brand); }
.theme-btn {
  display: inline-flex; align-items: center; height: 26px; box-sizing: border-box;
  background: none; border: 1px solid var(--line); padding: 0 9px; cursor: pointer; color: var(--muted); font-size: 12px;
}
.icon-btn { padding: 0 6px; text-decoration: none; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { display: block; height: 16px; width: 16px; fill: currentColor; }
.theme-btn:hover { color: var(--text); border-color: var(--line-strong); }

/* ── inputs ──────────────────────────────────────────── */
.prompt-field {
  display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line-strong);
}
.prompt-field span { padding: 0 0 0 12px; color: var(--brand); font-weight: 600; user-select: none; }
.prompt-field input {
  flex: 1; min-width: 0; height: 38px; padding: 0 12px 0 10px; border: 0; outline: none; background: transparent;
}
.prompt-field:focus-within { outline: 2px solid var(--brand); outline-offset: -1px; }
.prompt-field input::placeholder { color: var(--muted); }
.prompt-field input::-webkit-search-cancel-button { filter: grayscale(1); }

/* ── hero ────────────────────────────────────────────── */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero .dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero .wrap { position: relative; padding-top: 64px; padding-bottom: 150px; text-align: center; }
.wordmark { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto; }
.hero h1 { font-size: clamp(20px, 3.6vw, 30px); font-weight: 600; letter-spacing: -.01em; margin: 34px 0 8px; }
.hero p { margin: 0 auto; max-width: 560px; color: var(--muted); font-size: 14px; }
.hero .prompt-field { max-width: 560px; margin: 30px auto 0; border-width: 2px; }
.hero .prompt-field input { height: 50px; font-size: 16px; }
.hero .prompt-field span { font-size: 16px; }
.cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: -3px; background: var(--brand); margin-left: 2px; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); margin: 36px 0 0; background: var(--surface); }
.steps div { padding: 18px 20px; }
.steps div + div { border-left: 1px solid var(--line); }
.steps b { display: block; font-weight: 600; margin-bottom: 4px; }
.steps b em { font-style: normal; color: var(--brand); margin-right: 8px; }
.steps p { margin: 0; font-size: 13px; color: var(--muted); }
.steps code { color: var(--text); }

.guide-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 18px auto 0; padding: 4px 10px;
  background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 13px;
}
.guide-toggle:hover, .guide-toggle.open { color: var(--brand); }
.guide-toggle .chevron { fill: currentColor; }
.guide { margin-top: 36px; }
.guide h1 { font-size: 22px; }
.guide pre { position: relative; padding-right: 72px; }
.pre-copy { position: absolute; top: 8px; right: 8px; font-size: 12px; }
.guide:not([hidden]) + .guide-toggle { margin-top: 28px; }

/* ── content ─────────────────────────────────────────── */
main { padding: 28px 0 80px; }
body.home main { padding-top: 0; padding-bottom: 22px; }
.sec {
  display: flex; align-items: baseline; gap: 12px; margin: 34px 0 12px; font-size: 13px; text-transform: lowercase;
}
.sec b { font-weight: 600; color: var(--text); }
.sec b::before { content: "// "; color: var(--brand); }
.sec::after { content: ""; flex: 1; border-bottom: 1px dashed var(--line); transform: translateY(-4px); }
.error { color: var(--warn); padding: 14px 0; }
.error::before { content: "! "; font-weight: 700; }
.loading::after { content: "_"; color: var(--brand); }

.results { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); background: var(--surface); }
.results li + li { border-top: 1px solid var(--line); }
.results a { display: grid; grid-template-columns: 1fr auto; gap: 2px 18px; padding: 13px 16px; text-decoration: none; }
.results a:hover { background: var(--brand-soft); }
.results a:hover .name::before { content: "> "; color: var(--brand); }
.results .name { font-weight: 600; overflow-wrap: anywhere; }
.results .stats { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
.results .desc { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.official { color: var(--brand); font-weight: 600; font-size: 12px; margin-left: 8px; white-space: nowrap; }

.btn {
  display: block; margin: 14px auto 0; padding: 7px 16px; cursor: pointer;
  background: var(--brand); color: var(--brand-ink); border: 0; font-weight: 600; font-size: 13px;
}
.btn:hover { filter: brightness(1.08); }

.back { display: inline-block; color: var(--muted); font-size: 13px; text-decoration: none; margin-bottom: 14px; }
.back:hover { color: var(--brand); }
.repo-title { font-size: clamp(24px, 4vw, 34px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; overflow-wrap: anywhere; line-height: 1.2; }
.repo-title .official { font-size: 13px; vertical-align: 6px; }
.lede { margin: 0 0 8px; color: var(--muted); max-width: 680px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 600; }

.term { margin: 24px 0 8px; border: 1px solid var(--line-strong); background: var(--code); }
.term-bar {
  display: flex; justify-content: space-between; padding: 5px 12px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--line-strong); background: var(--surface-2);
}
.term-bar .dots { letter-spacing: 3px; color: var(--band-3); }
.term-line { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.term-line + .term-line { border-top: 1px dashed var(--line); }
.term-line .p { color: var(--brand); font-weight: 600; flex: none; user-select: none; }
.term-line code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: inherit; scrollbar-width: none; }
.term-line code::-webkit-scrollbar { display: none; }
.copy { flex: none; background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--muted); font-size: 13px; }
.copy:hover { color: var(--brand); }
.copy.done { color: var(--ok); }

.grep { margin-bottom: 10px; }
.tags { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.tags th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  padding: 8px 12px; border-bottom: 1px solid var(--line-strong); background: var(--surface-2);
}
.tags td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tags tr:last-child td { border-bottom: 0; }
.tags tbody tr[data-tag] { cursor: pointer; }
.tags tbody tr[data-tag]:hover td { background: var(--brand-soft); }
.tags tr.selected td { background: var(--select); }
.tags td.tagname { font-weight: 600; overflow-wrap: anywhere; }
.tags td.tagname::before { content: "  "; white-space: pre; color: var(--brand); }
.tags tr.selected td.tagname::before { content: "▶ "; }
.tags td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tags td.when { white-space: nowrap; color: var(--muted); }
.arch { display: inline-block; font-size: 12px; margin-right: 10px; color: var(--muted); white-space: nowrap; }
.arch.host { color: var(--brand); font-weight: 600; }
.arch.host::before { content: "["; } .arch.host::after { content: "]"; }

.readme { background: var(--surface); border: 1px solid var(--line); padding: 6px 24px 20px; overflow-wrap: anywhere; font-size: 14px; }
.readme a { color: var(--brand); }
.readme h1 { font-size: 20px; margin: 22px 0 8px; }
.readme h1::before { content: "# "; color: var(--brand); }
.readme h2 { font-size: 16px; margin: 24px 0 8px; }
.readme h2::before { content: "## "; color: var(--brand); }
.readme h3 { font-size: 14px; margin: 20px 0 6px; }
.readme h3::before { content: "### "; color: var(--brand); }
.readme code { background: var(--code); padding: .1em .35em; }
.readme pre { background: var(--code); border-left: 3px solid var(--brand); padding: 12px 14px; overflow-x: auto; }
.readme pre code { padding: 0; background: none; }
.readme table { border-collapse: collapse; display: block; overflow-x: auto; }
.readme th, .readme td { border: 1px solid var(--line); padding: 4px 10px; }
.readme img { max-width: 100%; height: auto; }
.readme blockquote { margin: 0; padding: 0 14px; color: var(--muted); border-left: 3px solid var(--line-strong); }
.readme ul { padding-left: 22px; }

footer { border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); padding: 18px 0 28px; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 680px) {
  .bar .wrap { gap: 10px; }
  .logo .name { display: none; }
  .steps { grid-template-columns: 1fr; }
  .steps div + div { border-left: 0; border-top: 1px solid var(--line); }
  .col-platforms { display: none; }
  .results a { grid-template-columns: 1fr; }
  .results .stats { text-align: left; }
  .hero .wrap { padding-top: 54px; padding-bottom: 110px; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="#/" aria-label="ddocker home"><span id="logo-mark"></span><span class="name">ddocker</span></a>
    <label class="prompt-field bar-search"><span>&gt;</span><input id="q" type="search" placeholder="search docker hub" autocomplete="off" spellcheck="false" aria-label="Search Docker Hub"></label>
    <div class="bar-right">
      <a class="theme-btn icon-btn" id="gh-link" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub" hidden></a>
      <button class="theme-btn" id="theme" type="button" title="Switch theme (T)"><span class="label">theme</span></button>
    </div>
  </div>
</header>
<div id="hero"></div>
<main class="wrap" id="view"></main>
<footer><div class="wrap"><span>ddocker // private docker hub mirror · read-only</span><span class="status" id="status" title="Checks that Docker Hub's registry answers through this mirror"><i></i><span id="status-text">mirror: checking</span></span></div></footer>

<script src="/hub/app.js" defer></script>
</body>
</html>
